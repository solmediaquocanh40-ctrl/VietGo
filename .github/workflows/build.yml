name: Build VIETGO (TrollStore IPA)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Unpack data pack (vietnam.sqlite)
        run: |
          cd VietGo/Resources
          unzip -o vietnam.sqlite.zip
          rm -f vietnam.sqlite.zip
          ls -lh vietnam.sqlite

      - name: Build app (unsigned, for TrollStore)
        run: |
          xcodebuild build \
            -project VietGo.xcodeproj \
            -scheme VietGo \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DD" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY=""

      - name: Package IPA for TrollStore
        run: |
          APP_PATH="$RUNNER_TEMP/DD/Build/Products/Release-iphoneos/VietGo.app"
          test -d "$APP_PATH"
          rm -rf Payload VietGo-TrollStore.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry VietGo-TrollStore.ipa Payload
          ls -lh VietGo-TrollStore.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VietGo-TrollStore-ipa
          path: VietGo-TrollStore.ipa
          if-no-files-found: error
